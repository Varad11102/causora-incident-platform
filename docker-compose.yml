name: causora

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    restart: unless-stopped
    mem_limit: 600m
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *bounded-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 220m
    environment:
      POSTGRES_DB: causora_incidents
      POSTGRES_USER: causora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - incident-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causora -d causora_incidents"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *bounded-logging

  telemetry-service:
    build: ./services/telemetry-service
    restart: unless-stopped
    mem_limit: 220m
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx96m
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    logging: *bounded-logging

  incident-service:
    build: ./services/incident-service
    restart: unless-stopped
    mem_limit: 320m
    environment:
      JAVA_TOOL_OPTIONS: -Xms48m -Xmx128m
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INCIDENT_DB_URL: jdbc:postgresql://postgres:5432/causora_incidents
      INCIDENT_DB_USER: causora
      INCIDENT_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging: *bounded-logging

  demo-payment-service:
    build: ./demo/services/demo-payment-service
    restart: unless-stopped
    mem_limit: 190m
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx96m
      TELEMETRY_BASE_URL: http://telemetry-service:8081
    ports:
      - "127.0.0.1:8090:8090"
    depends_on:
      telemetry-service:
        condition: service_started
    logging: *bounded-logging

  remediation-service:
    build: ./services/remediation-service
    restart: unless-stopped
    mem_limit: 280m
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx80m -XX:+UseSerialGC -XX:MaxMetaspaceSize=96m -XX:ReservedCodeCacheSize=32m -XX:MaxDirectMemorySize=16m -Xss256k
      REMEDIATION_DB_URL: jdbc:postgresql://postgres:5432/causora_incidents
      REMEDIATION_DB_USER: causora
      REMEDIATION_DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REMEDIATION_EXECUTION_ENABLED: "false"
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *bounded-logging

volumes:
  kafka-data:
  incident-postgres-data:
