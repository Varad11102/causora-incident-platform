spring:
  application:
    name: incident-service
  datasource:
    url: ${INCIDENT_DB_URL:jdbc:postgresql://localhost:5432/causora_incidents}
    username: ${INCIDENT_DB_USER:causora}
    password: ${INCIDENT_DB_PASSWORD:causora}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: incident-service-v1
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: 100
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: io.causora.events.OperationalEvent
        spring.json.trusted.packages: io.causora.events
    listener:
      ack-mode: record
server:
  port: 8082
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
causora:
  kafka:
    operational-events-topic: telemetry.operational.v1
