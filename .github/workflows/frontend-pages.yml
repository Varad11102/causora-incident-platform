name: Frontend Verify and Legacy Redirect

on:
  push:
    branches: [master]
    paths:
      - "frontend/**"
      - "legacy-pages/**"
      - ".github/workflows/frontend-pages.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "legacy-pages/**"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run build
      - name: Build production container
        run: docker build .

  redirect-artifact:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: legacy-pages

  deploy-redirect:
    if: github.event_name != 'pull_request'
    needs: redirect-artifact
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep the former URL working
        id: deployment
        uses: actions/deploy-pages@v5
